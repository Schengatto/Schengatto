<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Enrico Schintu. Senior Software Engineer, Tech Lead, full stack.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b2e"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4493f8"/><stop offset="1" stop-color="#a371f7"/></linearGradient></defs>
<style>
  .fade{animation:fade .7s ease-out backwards}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .flow{fill:none;stroke:#656c76;stroke-width:1.6;stroke-dasharray:4 6;animation:flow 1.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .name{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .role{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#4493f8;letter-spacing:.2px}
  .tag{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#9198a1}
</style>
<rect x="0.5" y="0.5" width="899" height="209" rx="14" fill="url(#bg)" stroke="#30363d"/>
<rect x="40" y="38" width="56" height="4" rx="2" fill="url(#accent)"/>
<text class="name fade" x="40" y="94">Enrico Schintu</text>
<text class="role fade" style="animation-delay:.25s" x="40" y="124">Senior Software Engineer · Tech Lead · Full stack</text>
<text class="tag fade" style="animation-delay:.5s" x="40" y="160">I turn business needs into production-ready software,</text>
<text class="tag fade" style="animation-delay:.5s" x="40" y="184">hands-on at every stage, from analysis to delivery.</text>
<path class="flow" d="M672 48 L760 105"/><path class="flow" d="M848 48 L760 105"/><path class="flow" d="M672 162 L760 105"/><path class="flow" d="M848 162 L760 105"/><path class="flow" d="M760 28 L760 105"/>
<rect x="730" y="81" width="60" height="48" rx="9" fill="#151b23" stroke="url(#accent)" stroke-width="2"/>
<rect x="739" y="91" width="11" height="28" rx="2" fill="#4493f8" opacity=".85"/>
<rect x="754.5" y="91" width="11" height="18" rx="2" fill="#a371f7" opacity=".85"/>
<rect x="770" y="91" width="11" height="10" rx="2" fill="#656c76" opacity=".85"/>
<circle class="pulse" style="animation-delay:0.00s" cx="672" cy="48" r="7" fill="#4493f8"/><circle class="pulse" style="animation-delay:0.45s" cx="848" cy="48" r="7" fill="#a371f7"/><circle class="pulse" style="animation-delay:0.90s" cx="672" cy="162" r="7" fill="#4493f8"/><circle class="pulse" style="animation-delay:1.35s" cx="848" cy="162" r="7" fill="#a371f7"/><circle class="pulse" style="animation-delay:1.80s" cx="760" cy="28" r="7" fill="#4493f8"/>
</svg>
